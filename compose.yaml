services:
  postgres:
    image: postgres:17
    container_name: ahicadde-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ahicadde
      POSTGRES_USER: ahicadde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahicadde -d ahicadde"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: ahicadde-local-redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ahicadde-local-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ahicadde-local-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1

  nginx:
    image: nginx:1.29-alpine
    container_name: ahicadde-local-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
