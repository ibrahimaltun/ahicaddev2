services:
  postgres:
    image: postgres:17
    container_name: ahicadde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ahicadde
      POSTGRES_USER: ahicadde
      POSTGRES_PASSWORD: ahicadde_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahicadde -d ahicadde"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ahicadde-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ahicadde-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ahicadde-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.29-alpine
    container_name: ahicadde-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
