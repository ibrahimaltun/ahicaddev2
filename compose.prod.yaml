name: ahicadde-prod

services:
  postgres:
    image: postgres:17
    container_name: ahicadde-prod-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ahicadde
      POSTGRES_USER: ahicadde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahicadde -d ahicadde"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ahicadde-prod-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ahicadde-prod-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ahicadde-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    # frontend'in FastAPI'ye hangi adresten bağlanacağını belirler
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1

  nginx:
    image: nginx:1.29-alpine
    container_name: ahicadde-prod-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
